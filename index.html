<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
      transition: background 0.2s;
    }

    button:hover {
      background: #4338ca;
    }

    button:disabled {
      background: #a5b4fc;
      cursor: default;
    }

    #output {
      margin-top: 24px;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      min-height: 2rem;
    }
  </style>
</head>
<body>
  <button id="btn" onclick="typeHelloWorld()">Click me</button>
  <div id="output"></div>

  <script>
    function typeHelloWorld() {
      const btn = document.getElementById('btn');
      const output = document.getElementById('output');
      const text = 'hello world';

      btn.disabled = true;
      output.textContent = '';

      let i = 0;
      const interval = setInterval(() => {
        output.textContent += text[i];
        i++;
        if (i === text.length) {
          clearInterval(interval);
          btn.disabled = false;
        }
      }, 100);
    }
  </script>
</body>
</html>
